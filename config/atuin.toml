# ═══════════════════════════════════════════════════════════════
# ATUIN CONFIGURATION - Optimized by Dotfiles
# ═══════════════════════════════════════════════════════════════
# Documentación: https://atuin.sh/docs/config

# ─────────────────────────────────────────────────────────────
# BÚSQUEDA
# ─────────────────────────────────────────────────────────────
# Modo de filtrado al buscar (Ctrl+R)
# Opciones: global, host, session, directory
filter_mode = "global"

# Modo de filtrado al presionar flecha arriba
# "session" = comandos de la sesión actual (comportamiento natural, como bash)
# "directory" = solo comandos del directorio actual (muy restrictivo)
# "global" = todo el historial con flecha arriba
filter_mode_shell_up_key_binding = "session"

# Modo de búsqueda: fuzzy (estilo fzf), prefix, fulltext
search_mode = "fuzzy"

# ─────────────────────────────────────────────────────────────
# INTERFAZ (UI)
# ─────────────────────────────────────────────────────────────
# Estilo de la UI de búsqueda
# Opciones: auto, full, compact
style = "compact"

# Búsqueda inline (sin ocupar toda la pantalla)
inline_height = 20

# Mostrar preview del comando completo
show_preview = true

# Mostrar contexto (directorio, host)
show_help = true

# No ejecutar el comando inmediatamente al presionar Enter; lo pone en la línea para poder editarlo
enter_accept = false

# No verificar actualizaciones al inicio (Atuin se gestiona vía mise)
update_check = false

# ─────────────────────────────────────────────────────────────
# SINCRONIZACIÓN
# ─────────────────────────────────────────────────────────────
# Sincronizar automáticamente
auto_sync = true

# Frecuencia de sync
sync_frequency = "10m"

# Dirección del sync server (default: atuin.sh)
# sync_address = "https://api.atuin.sh"

# ─────────────────────────────────────────────────────────────
# HISTORIAL
# ─────────────────────────────────────────────────────────────
# Filtrar comandos que podrían exponer secretos
secrets_filter = true

# Excluir comandos sensibles e internos
history_filter = [
    "^echo .*password",
    "^export.*TOKEN",
    "^export.*SECRET",
    "^export.*KEY",
    "^__atuin_restore_trap",
    "^_mise_hook",
    "^[0-9]+$",          # números solos (typos accidentales)
]
