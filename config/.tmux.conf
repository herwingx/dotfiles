# ==========================
# TMUX CONFIGURATION (Premium)
# ==========================

# 1. Configuración Básica
set -g mouse on               # Activar mouse (scroll, selección, resize)
set -g base-index 1           # Ventanas empiezan en 1 (no 0)
set -g pane-base-index 1      # Paneles empiezan en 1
set -g history-limit 10000    # Más historial

# 2. Keybindings Modernos
unbind C-b
set -g prefix C-a             # Prefix = Ctrl+a (como screen, más ergonómico)
bind C-a send-prefix

bind | split-window -h        # Split horizontal con |
bind - split-window -v        # Split vertical con -
unbind '"'
unbind %

# Recargar config con r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Navegación estilo Vim entre paneles
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 3. Estética (Status Bar Minimalista)
set -g status-bg '#1e1e2e'    # Fondo oscuro (Catppuccin style)
set -g status-fg '#cdd6f4'    # Texto claro
set -g status-interval 5      # Actualizar cada 5s
set -g status-left-length 50

# Izquierda: Sesión
set -g status-left "#[fg=#1e1e2e,bg=#89b4fa,bold] #S #[fg=#89b4fa,bg=#1e1e2e] "

# Centro: Ventanas
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#313244]#[fg=#cdd6f4,bg=#313244] #I #W #[fg=#313244,bg=#1e1e2e]"
setw -g window-status-format " #I #W "

# Derecha: Hora
set -g status-right "#[fg=#313244,bg=#1e1e2e]#[fg=#cdd6f4,bg=#313244] %H:%M #[fg=#89b4fa,bg=#313244]#[fg=#1e1e2e,bg=#89b4fa,bold] #H "

# 4. Colores de Paneles
set -g pane-border-style fg='#313244'
set -g pane-active-border-style fg='#89b4fa'
